<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Font: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
    }

    /* Lower-Third Bar with #1951a4 Background */
    .lower-third-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 125px;
      background: #1951a4;
      border-top: 3px solid #facc15;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      padding: 0 25px;
      box-sizing: border-box;
    }

    /* Left Side: Event Branding */
    .event-branding {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-right: 25px;
      border-right: 2px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
      min-width: 320px;
    }

    /* Competition Logo Box (Transparent Background & Enlarged Area) */
    .event-logo-box {
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
    }

    .event-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    .event-text {
      display: flex;
      flex-direction: column;
    }

    .event-title {
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    .event-subtitle {
      color: #facc15;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* Right Side: 4 Team Cards */
    .teams-container {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-left: 15px;
    }

    .team-card {
      flex: 1;
      max-width: 350px;
      height: 72px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      margin: 0 6px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
    }

    /* Team Logo Container (Maintained White Background) */
    .team-logo-container {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      margin-right: 10px;
      flex-shrink: 0;
    }

    .team-logo {
      max-width: 42px;
      max-height: 42px;
      object-fit: contain;
    }

    /* Team Names Styled in Montserrat */
    .team-name {
      flex-grow: 1;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 19px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .score-badge {
      background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
      color: #000000;
      font-family: 'Montserrat', sans-serif;
      font-size: 30px;
      font-weight: 900;
      min-width: 58px;
      height: 52px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      margin-left: 8px;
      flex-shrink: 0;
    }

    .score-badge.pop {
      animation: scorePop 0.4s ease-in-out;
    }

    @keyframes scorePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); background: #4ade80; color: #000; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="lower-third-bar">
    <div class="event-branding">
      <div class="event-logo-box">
        <img id="eventLogo" class="event-logo" src="" alt="Event Logo" style="display:none;">
      </div>
      <div class="event-text">
        <div id="eventTitle" class="event-title">NSMQ 2026</div>
        <div id="eventSubtitle" class="event-subtitle">ASHANTI REGIONAL QUALIFIERS</div>
      </div>
    </div>

    <div class="teams-container" id="teamsContainer"></div>
  </div>

  <script>
    const bc = new BroadcastChannel('quiz_scoreboard');
    const teamsContainer = document.getElementById('teamsContainer');
    let previousScores = {};

    function render(state) {
      const logoEl = document.getElementById('eventLogo');
      if (state.eventLogo) {
        logoEl.src = state.eventLogo;
        logoEl.style.display = 'block';
      } else {
        logoEl.style.display = 'none';
      }
      document.getElementById('eventTitle').innerText = state.eventTitle || 'NSMQ 2026';
      document.getElementById('eventSubtitle').innerText = state.eventSubtitle || 'REGIONAL QUALIFIERS';

      teamsContainer.innerHTML = '';
      state.teams.forEach((t, i) => {
        const hasChanged = previousScores[i] !== undefined && previousScores[i] !== t.score;
        const logoSrc = t.logo ? t.logo : 'https://via.placeholder.com/50?text=LOGO';

        const card = document.createElement('div');
        card.className = 'team-card';
        card.innerHTML = `
          <div class="team-logo-container">
            <img class="team-logo" src="${logoSrc}" alt="Logo">
          </div>
          <div class="team-name">${t.name}</div>
          <div class="score-badge ${hasChanged ? 'pop' : ''}">${t.score}</div>
        `;
        teamsContainer.appendChild(card);
        previousScores[i] = t.score;
      });
    }

    bc.onmessage = (e) => render(e.data);

    const defaultData = {
      eventTitle: 'NSMQ 2026',
      eventSubtitle: 'ASHANTI REGIONAL QUALIFIERS',
      eventLogo: 'nsmq_logo.png',
      teams: [
        { name: 'KUMASI ACAD.', score: 0, logo: 'kumasi.png' },
        { name: 'EJISU SHTS', score: 0, logo: 'ejisu.png' },
        { name: 'PREMPEH COLL.', score: 0, logo: 'prempeh.png' },
        { name: 'OWASS', score: 0, logo: 'owass.png' }
      ]
    };

    const saved = JSON.parse(localStorage.getItem('quiz_full_state'));
    render(saved || defaultData);
  </script>
</body>
</html>
